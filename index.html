<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaico de 4 vídeos de YouTube</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: #111; color: #eee; font-family: sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header { padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: #202020; }
  input { min-width: 180px; flex: 1; padding: 8px; }
  button { padding: 8px 12px; cursor: pointer; }
  #grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; }
  .slot { min-width: 0; min-height: 0; background: #000; }
  iframe { width: 100%; height: 100%; border: 0; }
  .hint { font-size: 12px; opacity: .8; }
  #showbar { position: fixed; right: 10px; top: 10px; z-index: 10; opacity: .18; }
  #showbar:hover, #showbar:focus { opacity: 1; }
  body.hide-header header { display: none; }
  body.hide-header #grid { flex: 1; }
  @media (max-width: 650px) { #grid { grid-template-columns: 1fr; grid-template-rows: repeat(4, 50vh); overflow: auto; } }
</style>
</head>
<body>
<header id="toolbar">
  <strong>Mosaico YouTube</strong>
  <input id="video" value="" placeholder="Pega aquí la URL de YouTube" aria-label="URL de YouTube">
  <button id="add">Cargar en el siguiente cuadro</button>
  <button id="clear">Limpiar</button>
  <button id="hide">Ocultar barra</button>
  <span class="hint">Añade hasta 4 vídeos. Al cargar el cuarto, la barra se oculta.</span>
</header>
<button id="showbar" title="Mostrar controles">☰</button>
<main id="grid">
  <div class="slot"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
</main>
<script>
(() => {
  const slots = [...document.querySelectorAll('.slot')];
  const toolbar = document.getElementById('toolbar');
  let next = 0;
  function getId(raw) {
    try {
      const u = new URL(raw.trim());
      if (u.hostname === 'youtu.be') return u.pathname.split('/').filter(Boolean)[0] || '';
      if (u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2] || '';
      if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2] || '';
      return u.searchParams.get('v') || '';
    } catch { return ''; }
  }
  function updateToolbar() {
    if (next === 0 && slots.every(s => s.querySelector('iframe'))) {
      document.body.classList.add('hide-header');
    }
  }
  document.getElementById('add').addEventListener('click', () => {
    const id = getId(document.getElementById('video').value);
    if (!id) { alert('Pega una URL válida de YouTube.'); return; }
    const slot = slots[next];
    slot.innerHTML = '';
    const frame = document.createElement('iframe');
    frame.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id);
    frame.title = 'Vídeo de YouTube';
    frame.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    frame.allowFullscreen = true;
    frame.referrerPolicy = 'strict-origin-when-cross-origin';
    slot.appendChild(frame);
    next = (next + 1) % slots.length;
    if (slots.every(s => s.querySelector('iframe'))) {
      document.body.classList.add('hide-header');
    }
    document.getElementById('video').value = '';
    document.getElementById('video').focus();
  });
  document.getElementById('clear').addEventListener('click', () => {
    slots.forEach(s => s.innerHTML = '');
    next = 0;
    document.body.classList.remove('hide-header');
  });
  document.getElementById('hide').addEventListener('click', () => {
    document.body.classList.add('hide-header');
  });
  document.getElementById('showbar').addEventListener('click', () => {
    document.body.classList.remove('hide-header');
  });
})();
</script>
</body>
</html>
